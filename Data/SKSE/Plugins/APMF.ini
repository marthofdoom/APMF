; ============================================================================
; Harbinger (APMF) -- Data/SKSE/Plugins/APMF.ini
;
; Every value below is the plugin's own compiled default UNLESS the comment on
; that key says otherwise. Deleting this file, or any key in it, is safe: the
; plugin falls back to the same compiled default and logs normally.
;
; 1 = on, 0 = off. Harbinger needs no configuration to work. This file exists so
; the switches are DISCOVERABLE and so a shipped build matches a tested one.
; ============================================================================

; ---------------------------------------------------------------------------
; [CastSeats] -- the seats that let a client's chosen spell actually be cast by
; the NPC's own AI. These are the feature, not diagnostics. Leave them on.
; ---------------------------------------------------------------------------
[CastSeats]
; Lets a heal aimed at someone else be understood by the game's own spell
; classifier. Without it a client's heal-other cannot be selected by the AI.
EnableSeat0Classify=1
; Lets the claimed spell be aimed at the claimed target.
EnableAimSeat=1

; ---------------------------------------------------------------------------
; [EquipGate] -- who is allowed to put something in a claimed hand.
; ---------------------------------------------------------------------------
[EquipGate]
; While a client holds a hand, the AI may not re-equip a different spell or
; staff into it. This is what stops a cast being swapped out mid-cast.
EnableEquipDenyComplete=1
; Verbose per-decision equip logging. Diagnosis only, noisy.
EnableEquipGateLog=0
; Prefer a second one-handed weapon over a shield for a perked follower.
; Off: it needs per-hand score data that does not exist yet.
EnableDualWieldPreference=0

; ---------------------------------------------------------------------------
; [AiCastSeats] -- score observation, and the one score lever.
; ---------------------------------------------------------------------------
[AiCastSeats]
; Lifts the AI's own combat score for an item a client prefers, so the AI picks
; it by its own rules: a spell a client's cast claim drives, or a weapon, shield,
; torch or staff a client declared with the equip preference (ABI v22). The lift
; is one step above the best other item in the same group, never from a score of
; 0, and only while the client outranks the source beneath the score in
; APMF_Sources.ini. 0 turns every lift off and refuses equip preference claims.
; Compiled default is 1 since ABI v22 (it was 0 in code and 1 in this file).
EnableScoreSteer=1
; Observe-only probes. All three only add log lines, none change behaviour.
; EnableWeaponScoreProbe also installs the weapon score seat the equip preference
; lifts weapons, shields and torches through: 0 leaves only spells and staves.
EnableWeaponScoreProbe=1
EnableItemScoreProbe=0
EnableCasterSeatProbe=0

; ---------------------------------------------------------------------------
; [EquipAuthority] -- the engine-equip facet, taken whole (ABI v7/v8, ch.17).
; A client declares what a follower wears. APMF equips that set and refuses
; every other engine equip of armor, weapons, ammo or a torch on that actor
; (outfit re-apply, AI weapon or armor choice, combat re-arm) until the client
; re-declares or releases. Potions, food, scrolls, ingredients and books are
; never governed. The player dressing the follower through the trade or gift
; menu is allowed unless the client asks for the strict form, EXCEPT an item in
; a category the client DENIES: the player may trade it, the follower never
; equips it (no route is exempt for a denied category). A client's claim
; binds the client too: its own equip of an item its declaration refuses is
; refused. The player and any actor without a claim are never touched.
; Docs/INVARIANTS.md #17a.
; ---------------------------------------------------------------------------
[EquipAuthority]
; Installs the seat. 0 = the seat is not installed and kIntent_EquipAuthority
; claims are REFUSED (the client keeps its own equips; logged once).
bEquipAuthority=1
; 0 (default) = ENFORCE every category the client declared: weapons, shields,
; torches, ammo and armor alike, in and out of combat. The combat AI does not
; pick an item the declaration refuses, the engine cannot equip one, and a worn
; item in a category the client DENIES is taken off (it stays in the inventory).
; 1 = observe only: every refusal is logged as would-deny / would-unequip and
; nothing is refused or taken off (a diagnostic opt-in, logged once at load).
bEquipObserveOnly=0
; 1 = also refuse Papyrus (EquipItem/EquipItemEx) and console equips of items
; outside the declared set. Off: scripts are a quest author's deliberate act.
; Scope (APMF-B65): this also applies on an actor with NO ch.17 claim whose hand a
; live cast claim holds (the hand-claim block reads it there too): with it set, a
; Papyrus / console equip into that held hand is refused as well.
; Since equip refusals follow the priorities (2026-10-12), a script or console equip
; ranks as "DirectCalls" (75 by default) on the Equip facet. A client at the default
; 50 does not outrank it, so with the default priorities this setting refuses
; nothing: the equip stands. It only takes effect for a client raised above
; DirectCalls in APMF_Sources.ini [EquipWeapon] or [EquipArmor] (the old [Equip] still works). An item in a category the client
; DENIES is ranked this way whatever this key says.
bEquipDenyScript=0
; The torch seat (2026-10-20). While a follower's equip claim owns the torch
; (Light) category, the engine's own torch logic is switched off for that
; follower: it no longer puts the torch away when the follower sits, sleeps or
; uses furniture, and no longer takes it out or puts it away by the light. The
; client mod decides the torch. When no claim owns Light the engine's torch
; logic is untouched. 0 = no seat: the engine stows and evaluates torches for
; every actor (its torch equips are still refused by the equip seat).
bTorchDeny=1

; ---------------------------------------------------------------------------
; [HandBlock] -- a hand taken for a cast is closed to every other action.
; While a cast claim holds a hand (a heal, an attack spell, or a client's "keep
; this hand empty" floor), the follower cannot put a weapon, a shield or a torch
; into that hand. The combat AI never picks one for it, and any other equip into
; it is refused. The other hand is untouched. When the claim ends, the follower
; arms itself again as usual. This is enforced whatever bEquipObserveOnly says.
; ---------------------------------------------------------------------------
[HandBlock]
; 0 = off: a weapon may be equipped into a hand a cast claim holds.
bHandClaimBlocksEquip=1

; ---------------------------------------------------------------------------
; [PackageGate] -- package redirection (what makes a follower walk to a body).
; ---------------------------------------------------------------------------
[PackageGate]
; Logs each redirect answer, including a heartbeat when none fire, so "never
; fired" is visibly different from "nothing was logged".
EnableRedirectLog=1
; The engine's Spectator package (a follower out of combat stops to watch a
; fight) is held off while a mod's package claim on that follower outranks the
; engine. 2 = on, 1 = log only (the package is still given), 0 = off.
iSpectatorSeat=2

; ---------------------------------------------------------------------------
; [ActorValueObserve] -- who changes the actor values a mod asked Harbinger to set.
; While a mod holds a follower's sneak noise, detection range, speed or
; disposition values through Harbinger, a change to one of them by the game,
; a script or another mod is named in the log and on the Harbinger page. Watch
; only: nothing is ever refused or changed.
[ActorValueObserve]
; 1 = watch (default), 0 = off.
iActorValueSeat=1

; ---------------------------------------------------------------------------
; [Travel] -- ch.19, ABI v10. "Walk this follower over there."
; A mod names an actor and a destination -- any object in the world, or a whole
; cell -- and Harbinger walks the actor there under its own travel package
; (Data/APMF.esl, which ships beside this file), stopping about 75 units short of
; an object or once the actor is inside a cell, and lets go the moment that actor
; is in combat. That is the whole feature. Harbinger does not pick a fight, does
; not claim the target and does not pretend anyone has seen anything. A mod that
; wants those asks for them separately.
; ---------------------------------------------------------------------------
[Travel]
; Installs the channel. 0 = kIntent_Travel claims are REFUSED (the mod keeps
; doing whatever it does on its own; logged once with the reason).
bTravel=1
; Passive gate probe 2 (observe-only, changes nothing). When a travel leg ends
; BLOCKED it logs [travel-gate2] lines: the navmesh under the stall and under
; the destination, and the doors / activators / obstacles next to the straight
; line between them, with their animation state and collision. 1 = on (only
; for a gate field test), 0 = off.
bGateProbe2=0

; ---------------------------------------------------------------------------
; [PositionCast] -- ABI v11. "Apply this spell right there."
; A mod names an actor, a Target Location spell and a point on the ground.
; Harbinger drops an invisible marker at the point, casts the spell from it in
; the actor's name, and deletes the marker a frame later. Summons are refused
; (the game only lets the caster itself summon), and so are runes and other
; spells that launch a projectile (the game only places those from the player's
; crosshair).
; ---------------------------------------------------------------------------
[PositionCast]
; OFF by default: the follower does not animate when a spell is cast this way,
; and every action needs a proper animation, so this is a building block, not a
; finished feature. 0 = every position-cast request is REFUSED (logged with the
; reason). 1 = on. Walking a follower to a point (Travel) works either way.
bPositionCast=0

; ---------------------------------------------------------------------------
; [TargetPin] -- ABI v13. "Fight THIS one."
; A mod names an actor and a target. While the actor is already fighting,
; Harbinger answers the game's own "who do I fight" question with that target,
; as long as the target is one the actor's side is already fighting. It never
; starts a fight. When the game ends the fight, or the target dies or unloads,
; the game picks its own targets again.
; ---------------------------------------------------------------------------
[TargetPin]
; Installs the seats. 0 = kIntent_TargetPin claims are REFUSED (the mod keeps
; doing its own targeting; logged once with the reason).
bTargetPin=1

; ---------------------------------------------------------------------------
; [CombatEntry] -- ABI v14. "Start a fight with THIS one."
; A mod names an actor and a target. Harbinger asks the game, once, to put the
; actor into combat against that target, the same way the game starts any
; fight. The game may say no. Harbinger never keeps the fight going and never
; stops it: what happens next is the game's AI (pair it with [TargetPin] to
; make the actor fight that target and not another). Whatever the world does
; about the fight (crime, guards, allies joining) is the mod's doing.
; ---------------------------------------------------------------------------
[CombatEntry]
; 0 = kIntent_CombatEntry claims are REFUSED (the mod starts fights its own
; way; logged once with the reason).
bCombatEntry=1

; ---------------------------------------------------------------------------
; [EngagementHold] -- "Once a fight is called, it is a move-to: it cannot be
; lost." When a mod starts a fight ([CombatEntry]) or pins a target
; ([TargetPin]), the game no longer drops that target because its own eyes
; lost track of it: Harbinger keeps the game's knowledge of where the target
; is, so the follower chases it the game's own way. It still ends when the
; target dies, is disabled or unloads, when the mod lets go, or when the
; follower makes no progress toward it for 20 seconds (logged as an anomaly).
; A leash ([PursuitLeash]) never holds back the approach to that target.
; ---------------------------------------------------------------------------
[EngagementHold]
; 0 = the old behaviour: a pin ends when the game loses the target, and the
; leash bounds the approach to it too. Everything below is off with it.
bEngagementHold=1
; 1 = keep the game's knowledge of a held target (its "last seen here" and
; "lost" mark). 0 = the hold still never ends on "lost", but the game may
; search for the target instead of chasing it.
bTargetKnowledge=1
; 1 = a held target that is down (bleeding out) is walked to: the follower's
; combat area is centred on it until it is up again. 0 = the game decides.
bBleedoutDrive=1
; 1 = DIAGNOSTIC (passive): one log line per follower per second showing what
; the game did to a held target's knowledge and what Harbinger wrote. Off by
; default.
bKnowledgeTrace=0

; ---------------------------------------------------------------------------
; [Idle] -- ABI v17. "Play THIS animation at THAT."
; A mod names an actor, an idle (an IDLE record) and optionally a reference to
; play it at. Harbinger asks the game, once, to play it. The old form-free
; idle (no idle named) is not affected by this switch.
; ---------------------------------------------------------------------------
[Idle]
; 0 = kIntent_Idle claims that name an idle are REFUSED (logged with the
; reason); claims without one still play the default-pose reset.
bIdleV2=1
; 1 = an idle counts as played only when the actor's behaviour graph raises
; one of that idle's own entry events (read from the graph at the call); none
; within 3 s of world time ends the claim ("ANIMATION NOT CONFIRMED").
; 0 = no graph read: every play is logged UNCONFIRMABLE and never ended for
; not playing (the kill switch for the graph read).
bIdleConfirm=1

; ---------------------------------------------------------------------------
; [CombatReentryDeny] -- ABI v15. "Stay out of the fight for a while."
; A mod names an actor and a number of seconds. While that time runs, the game
; cannot put the actor into combat: when it tries (it sees an enemy, it gets
; hit, an ally is fighting), the game's own combat start says no. Harbinger
; never stops a fight that is going on; the mod does that itself, once. The
; mod's own [CombatEntry] request still works.
; ---------------------------------------------------------------------------
[CombatReentryDeny]
; 0 = kIntent_CombatReentryDeny claims are REFUSED (the mod keeps the actor out
; of combat its own way; logged once with the reason).
bCombatReentryDeny=1

; ---------------------------------------------------------------------------
; [PursuitLeash] -- ABI v16. "Do not chase a fight away from me."
; A mod names an actor, an anchor actor (often the player) and a radius. While
; the actor is farther than the radius from the anchor, the game's own combat
; moves toward its target or its search area (close in, chase, flank,
; reposition, search) are refused when that goal is farther from the anchor
; still. The actor keeps fighting what comes to it: attacks, spells, blocks and
; every other move are untouched.
; ---------------------------------------------------------------------------
[PursuitLeash]
; 0 = kIntent_PursuitLeash claims are REFUSED (the mod leashes the actor its own
; way; logged at startup with the reason).
bPursuitLeash=1
; 1 = a leashed actor whose search the leash refuses is walked back toward its
; anchor (its combat area is centred on the anchor while it searches) instead
; of standing still. 0 = it stands where the leash stopped it.
bLeashReturn=1

; ---------------------------------------------------------------------------
; [CombatApproach] -- ABI v19. "Get within this distance of that actor, and keep
; fighting." A mod names an actor, a target X and a radius R. While the actor is
; in combat, its own combat area (the bound the game keeps every fighter inside)
; is centred on X with radius R: the game walks it back toward X when it is
; outside and keeps its tactical moves inside. Attacks, both hands' spells,
; blocks, the combat target and equipment decide as they would without it:
; every place the game reads the area for them sees its own area. A package that holds
; the actor in place still wins. Ends on arrival (unless the mod asks to hold),
; when X is lost, when combat ends, or when the mod releases it.
; ---------------------------------------------------------------------------
[CombatApproach]
; 0 = kIntent_CombatApproach claims are REFUSED (logged at startup with the reason).
bCombatApproach=1

; ---------------------------------------------------------------------------
; [CombatSubstrate] -- ABI v23. "Cast out of combat, animated."
; A follower's spell only plays its casting animation when the game's combat AI
; casts it, and that AI only exists in combat. For an out-of-combat cast,
; Harbinger puts the follower into combat against its own invisible stand-in
; actor (a ghost copy of Nazeem that lives in a holding cell), lets ONLY the
; claimed spell be cast, keeps the follower walking under its own package, and
; ends it right after the cast. Any real fight drops it at once.
; S2a: built, NOT yet field-proven. OFF until the P3 / P6 field runs pass.
; ---------------------------------------------------------------------------
[CombatSubstrate]
; 1 = install the substrate (the default, marth 2026-10-13: ships on). 0 = kIntent_CombatSubstrate claims
; are REFUSED and the dry run does not run.
bCombatSubstrate=1
; 1 = TEST SURFACE (P3 / P6): Harbinger opens a substrate itself on every idle,
; loaded player teammate every fSubstrateDryRunPeriodSec seconds, with no claim
; and no cast, for fSubstrateTtlSec seconds. Needs bCombatSubstrate=1.
bSubstrateDryRun=0
; 1 = PASSIVE PROBE (no deny, no write): while a substrate is open and for 10 s after,
; log change-only [substrate] CENSUS lines for actors that are not the player, the anchor
; or a live holder (teammates included) within 2048 u of a holder, or at any distance
; when their combat target is the anchor (combat controller, target, target-is-anchor, in
; a holder's group, fleeing, aggressor bit, alarm package). Capped per window. Default 1
; while the substrate is in test.
bSubstrateBystanderCensus=1
; 1 = refuse a StartCombat with NO target into a substrate's combat group by anyone who
; is not a substrate holder (that call joins the group and would fight the anchor).
; 1.6.1170 / 1.5.97 only. 0 = not refused (the anchor-leak sweep still cleans it up).
bSubstrateJoinGuard=1
; 1 = PASSIVE PROBE (no deny, no write): while a substrate is open, one change-only
; "[substrate] ENTRY StartCombat" line per actor for every StartCombat the engine makes:
; who called it, its target and group, and whether that group is a substrate's.
; 40 lines per 10 s. Default 1 while testing.
bSubstrateEntryTrace=1
fSubstrateDryRunPeriodSec=20
; How long a substrate stays open when the request does not say (seconds; a
; request's own param.fval wins; at most 15).
fSubstrateTtlSec=6
; 1 = P6 probe: one "[substrate] ... MOVE" line every 250 ms per open substrate
; (the package, the ignoring-combat bits, speed, distance to the player).
bSubstrateMoveTrace=0
; 1 = the music deny (ABI v26 build, ClickUp 86e3pu939): a combat group made only of
; substrate holders fighting the anchor has its battle-music decision set to "none"
; before the game decides it, so no battle music plays for a substrate. A real fight
; puts the decision back. 0 = off: the substrate runs and every open logs the hole.
bSubstrateMusicDeny=1
; 1 = PASSIVE PROBES (substrate round R1; no deny, no write): per substrate window one
; MOVE-BASELINE line (speed and distance to the player from 1 s before a dry-run pick, while
; open, and 3 s after the close), the context of a "re-pick did NOT run" line, each "other"
; ignoring-bit reset with its package, the aggressor bit before the entry / at the close /
; +1 s / +5 s, and how long the hands stay drawn after the close. Capped per window.
; Default 1 while the substrate is in test.
bSubstrateProbes=1
; 1 = the SPELL EQUIP: while a substrate holder has a driving cast claim, the engine's own
; combat AI may put the claimed spell in the claimed hand (the behaviour tree's spell-equip
; leaf and its "Action" branch run; every other equip leaf stays denied, and the hands'
; equip gates admit only the claimed spell on the claimed hand). 0 = off: the substrate
; never reaches its cast (the Action branch stays cut). Each window logs whether the spell
; reached the hand.
bSubstrateEquip=1
; 1 = F-6 (marth 2026-10-20): while a substrate holder is HELD (no real fight), the
; engine may not swap its package for its combat-override package (a vanilla
; follower's "PlayerFollowerCombatOverridePackage..." from its quest alias, or the
; NPC's own). The package it ran before the substrate stays in charge. Real fights
; and everyone else are untouched. Each denied swap is logged once per window.
; If its address check fails, the combat substrate is refused. 0 = the engine's
; swap runs (the holder walks under the override package; each open logs it).
bSubstrateOverrideDeny=1
; 1 = S2b: while a substrate holder is HELD, every time the engine resets its
; ignoring-combat bit (a package restart, or a step inside the package), Harbinger
; writes it back and logs it. Stops 15 s after the open. 0 (the default) = the bit
; is written once at the open (S2a) and resets are only counted. Stays 0 until the
; P6 field run passes and marth switches it on.
bSubstrateBitReassert=0

; ---------------------------------------------------------------------------
; [Sightline] -- Harbinger's own line of sight (ABI v18). Rays from an actor's
; eyes to another actor's feet, chest and head, in every direction. Mods ask
; for it with a flag on a cast claim or a target pin, or ask directly.
; ---------------------------------------------------------------------------
[Sightline]
; 0 = off: the line-of-sight flags are REFUSED at the request and mods keep
; their own test; the awareness query answers Unsupported too.
bOwnLineOfSight=1

; ---------------------------------------------------------------------------
; [Awareness] -- the "does this actor sense that one?" query (ABI v18).
; ---------------------------------------------------------------------------
[Awareness]
; 0 = hearing ignores the game's noise records (spells cast, arrows fired or
; landing, hits). Hearing a fight nearby, sight, being close and being
; fought still work.
bHearNoise=1

; ---------------------------------------------------------------------------
; [Harbinger] -- who drives each AI facet. Mods that ask Harbinger for a facet,
; and other mods that change the same facet on their own, are SOURCES. Each one
; has a priority from 0 to 100 per facet (0 = off). A mod's claim wins over
; another mod's change only when its priority is higher. Defaults: other mods
; 20, mods that ask Harbinger 50, Papyrus and console calls 75. A change
; Harbinger cannot trace to a mod is always allowed and shown as an alert.
; The priorities live in their own file, Data/SKSE/Plugins/APMF_Sources.ini,
; keyed by mod name ([Target] SmartNPCTargetSelector.dll=20). The Harbinger
; page in the SKSE Menu Framework edits it live. Without that framework, edit
; the file by hand.
; ---------------------------------------------------------------------------
[Harbinger]
; A passive probe, ON while it is field tested. It writes log lines only.
; Logs which game code asks for an actor's scene while a mod has given that
; actor a package (the scene hold-off is not built yet). 0 = off.
bSceneProbe=1

; ---------------------------------------------------------------------------
; [Probe] -- a passive probe that is ON while it is being field tested.
; It only writes log lines and changes nothing in the game.
; ---------------------------------------------------------------------------
[Probe]
; For an actor a mod has told to cast a spell (a cast claim), logs which kind
; of combat caster the game's AI builds for that spell (Restore, Offensive,
; Armor, Summon and the rest), whether it then fires it from the hand, whether
; the hand charged it, and the case where it builds nothing at all. Also counts,
; for every actor, how often each kind fires. Lines are rate limited. 0 = off.
; Goes back to 0 before the next release.
bCasterTypeCensus=1

; For an actor whose equipment a mod governs (an equip claim), logs how the
; game's combat AI picks a bow or crossbow, what its equip steps try to equip,
; whether the target can be reached, and which combat moves run while the mod
; owns the hands. Lines are rate limited. 1 = on (only for a field test),
; 0 = off.
bRangedSelect=0

; For an actor a mod has told to cast a healing or restoring spell (a cast
; claim), logs whether the game's combat AI ever reaches its own restore caster
; for that spell, how long that took, whether the hand took the spell, and the
; case where it never happens. Lines are rate limited. 0 = off. Goes back to 0
; before the next release.
bRestoreCensus=1

; ---------------------------------------------------------------------------
; DIAGNOSTICS -- all off. Only turn one on if you are chasing a specific bug
; and were asked to. The test surface takes live keyboard input.
; ---------------------------------------------------------------------------
[Input]
EnableTestSurface=0

[Probe.NativeBit]
Enable=0

[Probe.NonAlias]
EnableObserveLog=0

[Probe.mvcbt]
Enable=0
