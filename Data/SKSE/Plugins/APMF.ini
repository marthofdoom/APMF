; ============================================================================
; Harbinger (APMF) -- Data/SKSE/Plugins/APMF.ini
;
; Every value below is the plugin's own compiled default UNLESS the comment on
; that key says otherwise. Deleting this file, or any key in it, is safe: the
; plugin falls back to the same compiled default and logs normally.
;
; 1 = on, 0 = off. Harbinger needs no configuration to work. This file exists so
; the switches are DISCOVERABLE and so a shipped build matches a tested one.
; ============================================================================

; ---------------------------------------------------------------------------
; [CastSeats] -- the seats that let a client's chosen spell actually be cast by
; the NPC's own AI. These are the feature, not diagnostics. Leave them on.
; ---------------------------------------------------------------------------
[CastSeats]
; Lets a heal aimed at someone else be understood by the game's own spell
; classifier. Without it a client's heal-other cannot be selected by the AI.
EnableSeat0Classify=1
; Lets the claimed spell be aimed at the claimed target.
EnableAimSeat=1

; ---------------------------------------------------------------------------
; [EquipGate] -- who is allowed to put something in a claimed hand.
; ---------------------------------------------------------------------------
[EquipGate]
; While a client holds a hand, the AI may not re-equip a different spell or
; staff into it. This is what stops a cast being swapped out mid-cast.
EnableEquipDenyComplete=1
; Verbose per-decision equip logging. Diagnosis only, noisy.
EnableEquipGateLog=0
; Prefer a second one-handed weapon over a shield for a perked follower.
; Off: it needs per-hand score data that does not exist yet.
EnableDualWieldPreference=0

; ---------------------------------------------------------------------------
; [AiCastSeats] -- score observation, and the one score lever.
; ---------------------------------------------------------------------------
[AiCastSeats]
; Nudges the AI's own score for a spell a client has claimed, so the AI picks
; the claimed spell instead of its own preference.
; COMPILED DEFAULT IS 0. Shipped as 1: it was gated off until field data proved
; the underlying scoring hook actually runs, and the 2026-09-09 deck session
; confirmed it fires. This is the configuration that was field tested.
EnableScoreSteer=1
; Observe-only probes. All three only add log lines, none change behaviour.
EnableWeaponScoreProbe=1
EnableItemScoreProbe=0
EnableCasterSeatProbe=0

; ---------------------------------------------------------------------------
; [PackageGate] -- package redirection (what makes a follower walk to a body).
; ---------------------------------------------------------------------------
[PackageGate]
; Logs each redirect answer, including a heartbeat when none fire, so "never
; fired" is visibly different from "nothing was logged".
EnableRedirectLog=1

; ---------------------------------------------------------------------------
; DIAGNOSTICS -- all off. Only turn one on if you are chasing a specific bug
; and were asked to. The test surface takes live keyboard input.
; ---------------------------------------------------------------------------
[Input]
EnableTestSurface=0

[Probe.NativeBit]
Enable=0

[Probe.NonAlias]
EnableObserveLog=0

[Probe.mvcbt]
Enable=0
